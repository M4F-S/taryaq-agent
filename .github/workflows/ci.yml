name: Taryaq Deterministic Clinical Safety CI

on:
  push:
    branches: [ "main", "fix/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libcurl4-openssl-dev libsqlite3-dev python3 python3-pip

      - name: Build and verify acceptance suite (idempotent 2x)
        run: |
          make clean && make test
          make clean && make test

      - name: Verify HMAC audit chain
        run: |
          make audit-verify
