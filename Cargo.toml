[package]
name = "taryaq-agent"
version = "0.1.0"
edition = "2021"
authors = ["Mohamed Fathy, BPharm <lead@taryaq.ae>"]
description = "Taryaq Sovereign Clinical AI Agent - Dubai AI Agents Championship 2026-2027"
build = "build.rs"

[lib]
name = "taryaq"
path = "src/lib.rs"

[[bin]]
name = "taryaq_agent_daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
cxx = "1.0"
libc = "0.2"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.11.1"
hmac = "0.13.0"
hex = "0.4.3"

[build-dependencies]
cc = "1.1"
